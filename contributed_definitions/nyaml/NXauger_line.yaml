      for a specific line or ``INITIAL-TOTAL`` (e.g. ``K-TOTAL``) for the
      sum over all Auger lines originating from a given initial edge.
      
      The initial edge is one of: K, L1-L3, M1-M5. The two final edges range
      from L through Q.
