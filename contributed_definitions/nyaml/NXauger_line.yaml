\category: base
\doc: |
  An Auger line. It arises from the non-radiative decay of an atom with a
  core hole: an electron from a higher level fills the hole and another
  electron, the Auger electron, is ejected, with a kinetic energy
  characteristic of the atom.
\type: group
NXauger_line(NXobject):
  name(NX_CHAR):
