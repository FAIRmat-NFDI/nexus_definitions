\category: application
\doc: |
  High-energy resolution fluorescence detection (HERFD) is a particular
  case of partial fluorescence yield measured with a crystal analyzer
  spectrometer with an energy bandwidth of approximately 1-2 eV.
  
  The HERFD spectrum corresponds to a constant-emission-energy cut
  through the Resonant Inelastic X-ray Scattering (RIXS) plane.
  The spectral shape depends on the emission energy, making the
  emission line and emission energy mandatory metadata.
  
  The top-level :ref:`intensity </NXxas/ENTRY/intensity-field>`
  field stores the ratio :math:`I_f/I_0`, where :math:`I_f` is the
  fluorescence intensity diffracted by the crystal analyzer(s) and
  :math:`I_0` is the incident beam intensity. This ratio is
  proportional to the absorption coefficient:
  
  .. math:: \mu(E) \propto I_f/I_0
  
  The spectrometer uses Rowland circle geometry (Johann or Johansson
  type). Multiple crystal analyzers may be arranged at different
  horizontal angles around the sample to increase solid angle coverage.
  
  When the raw detector data and processing steps are available, they can be
  stored in the optional ``NXinstrument``, ``NXcollection``, and
  ``NXprocess`` groups, enabling full reproducibility of the data reduction.
\symbols:
  \doc: |
    The symbol(s) listed here will be used below to coordinate datasets
    with the same shape.
  nEnergy: |
    Number of energy data points
  nAnalyzers: |
    Number of crystal analyzers in the spectrometer
\type: group
NXxas_herfd(NXxas):
  (NXentry):
    definition:
      \doc: |
        Official NeXus NXDL schema to which this file conforms.
      \enumeration: [NXxas_herfd]
    intensity(NX_FLOAT):
      \unit: NX_ANY
      \doc: |
        The ratio :math:`I_f/I_0`, where :math:`I_f` is the
        fluorescence intensity diffracted by the crystal analyzer(s)
        and :math:`I_0` is the incident beam intensity.
      \dimensions:
        \rank: 1
        \dim: (nEnergy,)
    emission_line(NXemission_line):
      \doc: |
        The emission line at which the HERFD spectrum is measured.
      name:
    emission_energy(NX_FLOAT):
      \unit: NX_ENERGY
      \doc: |
        The emission energy at which the spectrometer is set.
    beamline_coordinate_system(NXcoordinate_system):
      \exists: optional
      \doc: |
        Beamline coordinate system with the sample at the origin:
        x along the beam, y horizontal, z opposite to gravity.
      origin:
        \enumeration: [sample]
      x_direction:
        \enumeration: [along incident beam]
      y_direction:
        \enumeration: [horizontal perpendicular to beam]
      z_direction:
        \enumeration: [opposite to gravity]
      x(NX_NUMBER):
        \unit: NX_LENGTH
        \enumeration: [[1, 0, 0]]
      y(NX_NUMBER):
        \unit: NX_LENGTH
        \enumeration: [[0, 1, 0]]
      z(NX_NUMBER):
        \unit: NX_LENGTH
        \enumeration: [[0, 0, 1]]
      depends_on(NX_CHAR):
        \doc: |
          Should point to
          ``transformations/beam``.
      transformations(NXtransformations):
        \doc: |
          Two rotations relating the beamline frame to
          the NeXus laboratory frame, plus direction
          vectors labeling beam and gravity.
        beam(NX_NUMBER):
          \unit: NX_UNITLESS
          \doc: |
            Direction of the incident beam in the beamline
            coordinate system.
          \@vector:
            \type: NX_NUMBER
            \enumeration: [[1, 0, 0]]
          \@depends_on:
            \enumeration: [gravity]
        gravity(NX_NUMBER):
          \unit: NX_UNITLESS
          \doc: |
            Direction of gravity in the beamline coordinate
            system.
          \@vector:
            \type: NX_NUMBER
            \enumeration: [[0, 0, -1]]
          \@depends_on:
            \enumeration: [rotate_gravity_to_minus_y]
        rotate_gravity_to_minus_y(NX_NUMBER):
          \unit: NX_ANGLE
          \doc: |
            Active rotation moving gravity from the
            beamline direction (-z) to the NeXus direction (-y).
          \@transformation_type:
            \enumeration: [rotation]
          \@vector:
            \type: NX_NUMBER
            \enumeration: [[1, 0, 0]]
          \@depends_on:
            \enumeration: [rotate_beam_to_plus_z]
        rotate_beam_to_plus_z(NX_NUMBER):
          \unit: NX_ANGLE
          \doc: |
            Active rotation moving the beam from the
            beamline direction (+x) to the NeXus direction (+z).
          \@transformation_type:
            \enumeration: [rotation]
          \@vector:
            \type: NX_NUMBER
            \enumeration: [[0, 1, 0]]
          \@depends_on:
            \doc: |
              Should point to ``.`` (the NeXus laboratory
              frame).
    (NXsample):
      depends_on(NX_CHAR):
        \exists: optional
        \doc: |
          The sample is at the origin of the beamline
          coordinate system, rotated about the vertical
          axis. Should point to
          ``transformations/sample_rotation``.
      transformations(NXtransformations):
        \exists: optional
        \doc: |
          Orientation of the sample in the beamline
          coordinate system.
        sample_rotation(NX_NUMBER):
          \unit: NX_ANGLE
          \doc: |
            Rotation of the sample about the vertical axis,
            orienting the sample surface between the incident beam
            and the crystal analyzers.
          \@transformation_type:
            \enumeration: [rotation]
          \@vector:
            \type: NX_NUMBER
            \enumeration: [[0, 0, 1]]
          \@depends_on:
            \doc: |
              Should point to
              ``/entry/beamline_coordinate_system``.
    (NXinstrument):
      \exists: optional
      beam(NXbeam):
        \exists: optional
        \doc: |
          The incident X-ray beam.
        depends_on(NX_CHAR):
          \exists: optional
          \doc: |
            Should point to
            ``transformations/beam_direction``.
        transformations(NXtransformations):
          \exists: optional
          beam_direction(NX_NUMBER):
            \unit: NX_UNITLESS
            \doc: |
              Beam direction in the beamline coordinate
              system. The beam travels along +x.
            \@vector:
              \type: NX_NUMBER
              \enumeration: [[1, 0, 0]]
            \@depends_on:
              \doc: |
                Should point to
                ``/entry/beamline_coordinate_system``.
      (NXsource):
        \exists: optional
        type:
        name:
        probe:
          \enumeration: [x-ray]
      i0(NXdetector):
        \exists: recommended
        \doc: |
          Detector measuring the incident beam intensity
          :math:`I_0`, positioned upstream of the sample along
          the beam direction.
        data(NX_NUMBER):
          \dimensions:
            \rank: 1
            \dim: (nEnergy,)
        depends_on(NX_CHAR):
          \exists: optional
          \doc: |
            Should point to
            ``transformations/i0_distance``.
        transformations(NXtransformations):
          \exists: optional
          i0_distance(NX_NUMBER):
            \unit: NX_LENGTH
            \doc: |
              Distance from the sample to the I0 detector,
              measured upstream along the beam (negative x
              direction in the beamline frame).
            \@transformation_type:
              \enumeration: [translation]
            \@vector:
              \type: NX_NUMBER
              \enumeration: [[-1, 0, 0]]
            \@depends_on:
              \doc: |
                Should point to
                ``/entry/beamline_coordinate_system``.
      analyzerCRYSTAL(NXcrystal):
        \nameType: partial
        \doc: |
          Crystal analyzer on the Rowland circle. For
          multi-crystal spectrometers, use one group per
          crystal (e.g. ``analyzer1``, ``analyzer2``).
        type:
          \exists: optional
          \doc: |
            Type or material of the analyzer crystal
            (Si, Ge, etc.).
        reflection(NX_INT):
          \unit: NX_UNITLESS
          \exists: optional
          \doc: |
            Miller indices (hkl) values of the nominal
            reflection.
          \dimensions:
            \rank: 1
            \dim: (3,)
        d_spacing(NX_FLOAT):
          \unit: NX_LENGTH
          \exists: optional
          \doc: |
            The spacing between crystal planes of the
            reflection.
        bragg_angle(NX_FLOAT):
          \unit: NX_ANGLE
          \exists: optional
          \doc: |
            Bragg angle :math:`\theta_B` of the nominal
            reflection.
        bending_radius(NX_FLOAT):
          \unit: NX_LENGTH
          \exists: optional
          \doc: |
            Bending radius of the spherically bent crystal
            analyzer. In Johann geometry this is :math:`2R_R`
            (twice the Rowland radius).
        rowland_radius(NX_FLOAT):
          \unit: NX_LENGTH
          \exists: optional
          \doc: |
            Radius of the Rowland circle :math:`R_R`. The
            sample, crystal center, and detector focus all
            lie on this circle.
        energy_resolution(NX_FLOAT):
          \unit: NX_ENERGY
          \exists: optional
          \doc: |
            The energy bandwidth or resolution of the crystal
            analyzer.
        geometry_type:
          \exists: optional
          \doc: |
            The type of crystal analyzer geometry.
          \enumeration: [Johann, Johansson]
        diameter(NX_FLOAT):
          \unit: NX_LENGTH
          \exists: optional
          \doc: |
            Diameter of the crystal analyzer wafer.
        depends_on(NX_CHAR):
          \exists: optional
          \doc: |
            Should point to the last transformation in the
            chain, i.e.
            ``transformations/analyzer_distance``.
        transformations(NXtransformations):
          \exists: optional
          \doc: |
            Transformation chain placing the analyzer relative
            to the sample: azimuthal angle, polar angle,
            then distance.
          analyzer_distance(NX_NUMBER):
            \unit: NX_LENGTH
            \doc: |
              Sample-to-analyzer distance.
            \@transformation_type:
              \enumeration: [translation]
            \@vector:
              \type: NX_NUMBER
              \enumeration: [[1, 0, 0]]
            \@depends_on:
              \enumeration: [analyzer_polar_angle]
          analyzer_polar_angle(NX_NUMBER):
            \unit: NX_ANGLE
            \doc: |
              Polar angle of the analyzer in the vertical
              Rowland plane. Elevation from the horizontal
              beam plane to the sample-analyzer direction.
            \@transformation_type:
              \enumeration: [rotation]
            \@vector:
              \type: NX_NUMBER
              \enumeration: [[0, -1, 0]]
            \@depends_on:
              \enumeration: [analyzer_azimuthal_angle]
          analyzer_azimuthal_angle(NX_NUMBER):
            \unit: NX_ANGLE
            \doc: |
              Azimuthal (horizontal) angle of the
              spectrometer arm from the incident beam
              direction. Rotation around the vertical
              z-axis. Typically around 90 degrees to
              minimize elastic scattering.
            \@transformation_type:
              \enumeration: [rotation]
            \@vector:
              \type: NX_NUMBER
              \enumeration: [[0, 0, 1]]
            \@depends_on:
              \doc: |
                Should point to
                ``/entry/beamline_coordinate_system``.
      ifluor(NXdetector):
        \exists: recommended
        \doc: |
          Detector measuring the fluorescence intensity
          :math:`I_f` diffracted by the crystal analyzer(s).
        data(NX_NUMBER):
          \dimensions:
            \rank: 1
            \dim: (nEnergy,)
        depends_on(NX_CHAR):
          \exists: optional
          \doc: |
            Should point to the last transformation in the
            chain, i.e.
            ``transformations/if_distance``.
        transformations(NXtransformations):
          \exists: optional
          \doc: |
            Transformation chain placing the detector relative
            to the sample: azimuthal angle, polar angle,
            then distance.
          if_distance(NX_NUMBER):
            \unit: NX_LENGTH
            \doc: |
              Distance from the sample to the detector.
            \@transformation_type:
              \enumeration: [translation]
            \@vector:
              \type: NX_NUMBER
              \enumeration: [[1, 0, 0]]
            \@depends_on:
              \enumeration: [if_polar_angle]
          if_polar_angle(NX_NUMBER):
            \unit: NX_ANGLE
            \doc: |
              Polar angle of the detector in the vertical
              Rowland plane.
            \@transformation_type:
              \enumeration: [rotation]
            \@vector:
              \type: NX_NUMBER
              \enumeration: [[0, -1, 0]]
            \@depends_on:
              \enumeration: [if_azimuthal_angle]
          if_azimuthal_angle(NX_NUMBER):
            \unit: NX_ANGLE
            \doc: |
              Azimuthal (horizontal) angle of the detector
              from the incident beam direction. Should
              match the analyzer azimuthal angle for
              on-Rowland focusing.
            \@transformation_type:
              \enumeration: [rotation]
            \@vector:
              \type: NX_NUMBER
              \enumeration: [[0, 0, 1]]
            \@depends_on:
              \doc: |
                Should point to
                ``/entry/beamline_coordinate_system``.
    (NXcollection):
      \exists: optional
      \doc: |
        Raw data as written by the acquisition software,
        preserved without modification to allow independent
        reprocessing.
      raw_data(NX_FLOAT):
        \exists: optional
        \doc: |
          Raw fluorescence counts per incident energy point for
          each crystal analyzer, before normalization by the
          incident beam intensity and summation over analyzers.
          Axis 0 is the energy scan axis; axis 1 enumerates the
          crystal analyzers, in the same order as the
          ``analyzerCRYSTAL`` groups.
        \dimensions:
          \rank: 2
          \dim: (nEnergy, nAnalyzers)
    (NXprocess):
      \exists: optional
      \doc: |
        Description of how :ref:`intensity
        </NXxas/ENTRY/intensity-field>` was obtained from
        the raw detector data (i0, if).
      program(NX_CHAR):
        \exists: optional
        \doc: |
          Name of the program used for processing.
      version(NX_CHAR):
        \exists: optional
        \doc: |
          Version of the program used for processing.
      date(NX_DATE_TIME):
        \exists: optional
        \doc: |
          Date and time of processing.
      note(NXnote):
        \exists: optional
        \doc: |
          Python code reproducing the top-level :ref:`intensity
          </NXxas/ENTRY/intensity-field>` from the raw
          data.
        type:
          \doc: |
            Mime content type of the note data field.
          \enumeration: [text/x-python]
        data(NX_CHAR):
          \doc: |
            The Python code.

